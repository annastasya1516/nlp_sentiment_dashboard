{% extends "base_admin.html" %}

{% block title %}
Edit Riwayat - SentiView
{% endblock %}


{% block content %}

<!-- =========================================
     HEADER
========================================= -->

<header class="admin-header">

    <div>

        <h1>
            Edit Riwayat
        </h1>

        <p>
            Perbarui data klasifikasi sentimen.
        </p>

    </div>

</header>


<!-- =========================================
     EDIT DATA
========================================= -->

<section class="dashboard-content">

    <div class="dashboard-title">

        <h2>
            Edit Data
        </h2>

        <p>
            Perbarui informasi riwayat klasifikasi yang dipilih.
        </p>

    </div>


    <form
        action="{{ url_for(
            'admin_edit_riwayat',
            id_data=data[0]
        ) }}"
        method="POST"
        class="edit-form"
    >

        <!-- HALAMAN -->

        <input
            type="hidden"
            name="halaman"
            value="{{ halaman }}"
        >


        <!-- TEKS ASLI -->

        <div class="form-group">

            <label for="teks_asli">
                Teks Asli
            </label>

            <textarea
                id="teks_asli"
                name="teks_asli"
                rows="4"
                required
            >{{ data[1] }}</textarea>

        </div>


        <!-- TEKS BERSIH -->

        <div class="form-group">

            <label for="teks_bersih">
                Teks Bersih
            </label>

            <textarea
                id="teks_bersih"
                name="teks_bersih"
                rows="4"
                required
            >{{ data[2] }}</textarea>

        </div>


        <!-- SENTIMEN + CONFIDENCE -->

        <div class="form-row">

            <!-- SENTIMEN -->

            <div class="form-group">

                <label for="klasifikasi">
                    Sentimen
                </label>

                <select
                    id="klasifikasi"
                    name="klasifikasi"
                    required
                >

                    <option
                        value="positive"
                        {% if data[3] == "positive" %}
                            selected
                        {% endif %}
                    >
                        Positive
                    </option>

                    <option
                        value="neutral"
                        {% if data[3] == "neutral" %}
                            selected
                        {% endif %}
                    >
                        Neutral
                    </option>

                    <option
                        value="negative"
                        {% if data[3] == "negative" %}
                            selected
                        {% endif %}
                    >
                        Negative
                    </option>

                    <option
                        value="invalid"
                        {% if data[3] == "invalid" %}
                            selected
                        {% endif %}
                    >
                        Invalid
                    </option>

                </select>

            </div>


            <!-- CONFIDENCE -->

            <div class="form-group">

                <label for="confidence">
                    Confidence
                </label>

                <input
                    type="number"
                    id="confidence"
                    name="confidence"
                    step="0.01"
                    min="0"
                    max="100"
                    value="{% if data[4] is not none %}{{ "%.2f"|format(data[4]) }}{% endif %}"
                >

            </div>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="form-actions">

            <a
                href="{{ url_for(
                    'admin_riwayat',
                    halaman=halaman
                ) }}"
                class="cancel-button"
            >
                Batal
            </a>

            <button
                type="submit"
                class="save-button"
            >
                Simpan Perubahan
            </button>

        </div>

    </form>

</section>

{% endblock %}
