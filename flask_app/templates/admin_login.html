<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Login Admin - SentiView</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >
</head>
<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-brand">
                <h1>SentiView</h1>
                <span>ADMIN</span>
            </div>

            <div class="login-header">
                <h2>Login Admin</h2>

                <p>
                    Masuk untuk mengakses dashboard administrasi.
                </p>
            </div>

            <form
                method="POST"
                class="login-form"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

    {% if error %}
    <script>
        alert("{{ error }}");
    </script>
    {% endif %}

    {% if success %}
    <script>
        alert("{{ success }}");
        window.location.href = "/admin";
    </script>
    {% endif %}

</body>

</html>
