<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="SentiView Admin Dashboard"
    >

    <title>
        {% block title %}
            SentiView Admin
        {% endblock %}
    </title>


    <!-- SB ADMIN -->

    <link
        href="{{ url_for('admin_static', filename='css/styles.css') }}"
        rel="stylesheet"
    >


    <!-- CUSTOM CSS -->

    <link
        href="{{ url_for('admin_static', filename='css/custom.css') }}"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <script
        src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
        crossorigin="anonymous"
    ></script>


    {% block extra_css %}
    {% endblock %}

</head>


<body class="sb-nav-fixed">


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    {% include "components/navbar.html" %}


    <!-- ================================================= -->
    <!-- LAYOUT -->
    <!-- ================================================= -->

    <div id="layoutSidenav">


        <!-- ================================================= -->
        <!-- SIDEBAR -->
        <!-- ================================================= -->

        {% include "components/sidebar.html" %}


        <!-- ================================================= -->
        <!-- MAIN CONTENT -->
        <!-- ================================================= -->

        <div id="layoutSidenav_content">

            <main>

                {% block content %}
                {% endblock %}

            </main>


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <footer class="py-4 bg-light mt-auto">

                <div class="container-fluid px-4">

                    <div
                        class="d-flex align-items-center justify-content-between small"
                    >

                        <div class="text-muted">
                            SentiView &copy; 2026
                        </div>

                        <div>
                            NLP Sentiment Classification
                        </div>

                    </div>

                </div>

            </footer>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->


    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"
    ></script>


    <!-- SB ADMIN -->

    <script
        src="{{ url_for('admin_static', filename='js/scripts.js') }}"
    ></script>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
