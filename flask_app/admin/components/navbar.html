    </a>


    <!-- Sidebar Toggle -->

    <button
        class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0"
        id="sidebarToggle"

    >
        <i class="fas fa-bars"></i>
    </button>


    <!-- Search -->

    <form
        class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0"
    >

        <div class="input-group">

            <input
                class="form-control"
                type="text"
                id="navbarSearch"
                placeholder="Cari..."
                aria-label="Cari"
            >

            <button
                class="btn btn-primary"
                id="btnNavbarSearch"
                type="button"
            >
                <i class="fas fa-search"></i>
            </button>

        </div>

    </form>


    <!-- User Menu -->

    <ul
        class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4"
    >

        <li class="nav-item dropdown">

            <a
                class="nav-link dropdown-toggle"
                id="navbarDropdown"
                href="#"
                role="button"
                data-bs-toggle="dropdown"

                <i class="fas fa-user fa-fw"></i>

            <ul

                <li>

</nav>
<script>
    const navbarSearch =
        document.getElementById("navbarSearch");

    const btnNavbarSearch =
        document.getElementById("btnNavbarSearch");

    function lakukanPencarian() {

        const keyword =
            navbarSearch.value
                .trim()
                .toLowerCase();

        if (!keyword) {
            return;
        }

        if (
            keyword.includes("dashboard")
        ) {
            window.location.href =
                "{{ url_for('dashboard') }}";

        } else if (
            keyword.includes("riwayat") ||
            keyword.includes("data")
        ) {
            window.location.href =
                "{{ url_for('riwayat') }}";

        } else if (
            keyword.includes("statistik") ||
            keyword.includes("statistic")
        ) {
            window.location.href =
                "{{ url_for('statistik') }}";

        } else if (
            keyword.includes("model") ||
            keyword.includes("sentimen") ||
            keyword.includes("sentiment")
        ) {
            window.location.href =
                "{{ url_for('model_sentimen') }}";

        } else {
            alert(
                "Halaman yang dicari tidak ditemukan."
            );
        }
    }


    btnNavbarSearch.addEventListener(
        "click",
        lakukanPencarian
    );


    navbarSearch.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                event.preventDefault();

                lakukanPencarian();
            }

        }
    );
</script>
