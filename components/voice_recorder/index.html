<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #startButton {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
        }
        #startButton:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <button id="startButton">
        🎤
    </button>
    <div id="status">
        Klik microphone untuk mulai
    </div>
    <script>
        // ELEMENT HTML
        const startButton =
            document.getElementById("startButton");
        const statusText =
            document.getElementById("status");
        // VARIABEL
        let recognition = null;
        let silenceTimer = null;
        let isRecording = false;
        let finalTranscript = "";
        let recordingId = null;
        // STREAMLIT COMPONENT
        function componentReady() {
            window.parent.postMessage(
                {
                    isStreamlitMessage: true,
                    type: "streamlit:componentReady",
                    apiVersion: 1
                },

                "*"
            );
        }
        function sendValueToStreamlit(value) {
            window.parent.postMessage(
                {
                    isStreamlitMessage: true,
                    type: "streamlit:setComponentValue",
                    value: value
                },
                "*"
            );
        }
        function setFrameHeight() {
            window.parent.postMessage(
                {
                    isStreamlitMessage: true,
                    type: "streamlit:setFrameHeight",
                    height: 120
                },
                "*"
            );
        }
        // CEK SUPPORT BROWSER
        function cekBrowser() {
            if (!("webkitSpeechRecognition" in window)) {
                statusText.textContent =
                    "Browser tidak mendukung Speech Recognition.";
                startButton.disabled = true;
                return false;
            }
            return true;
        }
        // INISIALISASI SPEECH RECOGNITION
        function initRecognition() {
            recognition =
                new webkitSpeechRecognition();
            recognition.lang = "id-ID";
            recognition.continuous = true;
            recognition.interimResults = true;
            // REKAMAN DIMULAI
            recognition.onstart = function () {
                isRecording = true;
                finalTranscript = "";
                // ID unik untuk setiap rekaman
                recordingId =
                    Date.now().toString();
                startButton.textContent = "🔴";
                statusText.textContent =
                    "🎙️ Sedang mendengarkan...";
                resetSilenceTimer();
            };
            // HASIL TRANSKRIPSI
            recognition.onresult = function (event) {
                let transcript = "";
                for (
                    let i = 0;
                    i < event.results.length;
                    i++
                ) {
                    transcript +=
                        event.results[i][0].transcript;
                }
                finalTranscript =
                    transcript.trim();
                // Reset timer setiap ada suara
                resetSilenceTimer();
            };
            // ERROR
            recognition.onerror = function (event) {
                console.log(
                    "Speech recognition error:",
                    event.error
                );
                clearTimeout(
                    silenceTimer
                );
                isRecording = false;
                startButton.textContent =
                    "🎤";
                statusText.textContent =
                    "Error: " + event.error;
            };
            // REKAMAN SELESAI
            recognition.onend = function () {
                isRecording = false;
                clearTimeout(
                    silenceTimer
                );
                startButton.textContent =
                    "🎤";
                statusText.textContent =
                    "✅ Selesai merekam.";
                // Kirim hasil hanya setelah
                // rekaman benar-benar selesai
                if (
                    finalTranscript !== ""
                ) {
                    sendValueToStreamlit(
                        {
                            text: finalTranscript,
                            selesai: true,
                            recording_id: recordingId
                        }
                    );
                }
            };
        }
        // MULAI / STOP REKAMAN
        function toggleRecording() {
            if (!recognition) {
                return;
            }
            if (isRecording) {
                stopRecording();
                return;
            }
            startRecording();
        }
        function startRecording() {
            try {
                recognition.start();
            } catch (error) {
                console.log(
                    "Recognition gagal:",
                    error
                );
            }
        }
        function stopRecording() {
            clearTimeout(
                silenceTimer
            );
            if (
                recognition &&
                isRecording
            ) {

                recognition.stop();
            }
        }
        // TIMER DIAM 3 DETIK
        function resetSilenceTimer() {
            clearTimeout(
                silenceTimer
            );
            silenceTimer =
                setTimeout(
                    function () {
                        if (
                            recognition &&
                            isRecording
                        ) {
                            statusText.textContent =
                                "⏹️ Diam 3 detik. Rekaman dihentikan.";
                            recognition.stop();
                        }
                    },
                    3000
                );
        }
        // EVENT BUTTON
        startButton.addEventListener(
            "click",
            toggleRecording
        );
        // INISIALISASI
        if (cekBrowser()) {
            initRecognition();
        }
        componentReady();
        setFrameHeight();
    </script>
</body>
</html>
